<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deplasman Bilet Sayacı</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- GENEL AYARLAR --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
            /* Arka planı koyu yeşil/saha tonu yaptık */
            background: #1a2a1a url('https://www.tff.org/Resources/TFF/Images/General/tff-org-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* --- KART TASARIMI --- */
        .card {
            background: rgba(0, 0, 0, 0.85); /* Daha koyu siyah zemin */
            width: 90%;
            max-width: 800px;
            padding: 50px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            text-align: center;
            position: relative;
        }

        /* --- LOGOLAR ALANI --- */
        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; /* Logolar arası boşluk */
            margin-bottom: 40px;
        }

        .team-logo {
            width: 130px; 
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
            transition: transform 0.3s;
        }
        
        .team-logo:hover { transform: scale(1.1); }

        /* --- PROGRESS BAR --- */
        .progress-wrapper {
            position: relative;
            width: 90%;
            margin: 0 auto 30px auto;
        }

        .progress-container {
            background-color: #2e2e42; /* Barın boş rengi (Koyu Lacivert/Gri) */
            height: 50px;
            border-radius: 25px;
            overflow: hidden; /* Taşan kısımları gizle */
            width: 100%;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .progress-bar {
            background-color: #00b140; /* Rizespor Yeşili */
            height: 100%;
            width: 0%; /* JS ile dolacak */
            border-radius: 25px; /* Yumuşak köşeler */
            transition: width 1s ease-in-out;
            box-shadow: 0 0 15px rgba(0, 177, 64, 0.5); /* Yeşil parlama efekti */
        }

        /* Yüzde Yazısı - Barın sağında */
        .percentage-badge {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            z-index: 5;
            text-shadow: 1px 1px 2px black;
        }

        /* --- METİNLER --- */
        .label-text {
            font-size: 1.6rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            color: #ddd;
        }

        .numbers {
            font-size: 5.5rem;
            font-weight: 700;
            margin: 5px 0;
            line-height: 1;
            font-style: italic;
            text-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .total-capacity {
            font-size: 3rem;
            color: #aaa;
        }

        .footer-date {
            font-size: 0.9rem;
            margin-top: 25px;
            text-align: right;
            padding-right: 5%;
            color: #888;
        }

        /* Mobil Uyum */
        @media (max-width: 600px) {
            .logos { gap: 20px; }
            .team-logo { width: 80px; height: 80px; }
            .percentage-badge { font-size: 1.5rem; }
            .numbers { font-size: 3.5rem; }
            .total-capacity { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logos">
            <img src="https://upload.wikimedia.org/wikipedia/tr/c/cd/%C4%B0stanbul_Ba%C5%9Fak%C5%9Fehir_FK.png" alt="Başakşehir" class="team-logo">
            
            <img src="https://caykurrizespor.org.tr/Arsiv/Sistem/2021/07/23/1627035358.jpg" alt="Rizespor" class="team-logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Red_X_icon.svg/1024px-Red_X_icon.svg.png'">
        </div>

        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="percentage-badge" id="percentageText">%0</div>
        </div>

        <div class="label-text">DEPLASMAN BİLET / KAPASİTE</div>

        <div class="numbers">
            <span id="soldText">0</span> <span class="total-capacity">/ <span id="capacityText">0</span></span>
        </div>

        <div class="footer-date" id="dateText">GÜNCELLEME: --.--</div>
    </div>

    <script>
        /* ================= AYARLAR ================= */
        const config = {
            sold: 198,           // Satılan Bilet
            capacity: 545,      // Toplam Kapasite
            date: "31.01.2026", // Tarih
            time: "16.32"       // Saat
        };
        /* =========================================== */

        function updateDashboard() {
            const percent = (config.sold / config.capacity) * 100;
            // Yüzdeyi hesapla (virgülden sonra 1 basamak)
            const formattedPercent = percent.toFixed(1).replace('.', ',');

            document.getElementById('soldText').innerText = config.sold;
            document.getElementById('capacityText').innerText = config.capacity;
            document.getElementById('percentageText').innerText = '%' + formattedPercent;
            document.getElementById('dateText').innerText = `GÜNCELLEME TARİHİ: ${config.time} | ${config.date}`;
            
            // Bar genişliğini ayarla
            // Çok küçükse bile en az %2 görünsün ki tamamen kaybolmasın
            const displayPercent = percent < 2 ? 2 : percent;
            document.getElementById('progressBar').style.width = displayPercent + '%';
        }

        updateDashboard();
    </script>

</body>
</html>
